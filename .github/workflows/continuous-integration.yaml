---
name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
    branches:
    - master
  push:
    branches:
    - master

permissions:
  contents: read

cache-mode: none

env:
  CARDANO_NODE_VERSION: "11.1.1"
  # cardano-playground has no node-11.1.1-config tag yet, so configs stay
  # pinned to the newest tagged set.
  CARDANO_CONFIG_TAG: "node-11.0.1-config"
  NETWORK: preview

jobs:
  fork-checks:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: true
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: lts/jod

    - name: Build and lint TypeScript client
      working-directory: clients/TypeScript
      run: |
        yarn install --frozen-lockfile --non-interactive --loglevel=error
        yarn build
        yarn lint

  # TODO: switch back to this once Hydra reports check-runs to GitHub
  # wait-for-hydra:
  #   runs-on: ubuntu-latest
  #   steps:
  #   - name: Wait for Hydra build
  #     env:
  #       GH_TOKEN: ${{ github.token }}
  #     run: |
  #       check_name="ci/hydra-build:required"
  #       while true; do
  #         conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$check_name" \
  #           --paginate --jq '.check_runs[].conclusion')
  #         case "$conclusion" in
  #           success) echo "Hydra build succeeded"; exit 0 ;;
  #           "") echo "Hydra build pending, waiting 30s..."; sleep 30 ;;
  #           *) echo "Hydra build failed with: $conclusion"; exit 1 ;;
  #         esac
  #       done

  clients_TypeScript:
    # Repository writers are trusted to run integration tests with AWS access.
    # This routes fork jobs; GitHub's fork secret/token restrictions enforce isolation.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      S3_DB_PATH: s3://${{ secrets.AWS_S3_BUCKET }}/db-preview
    # needs:
    # - wait-for-hydra
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: true
        persist-credentials: false

    - name: Install Nix
      uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
      with:
        extra_nix_config: |
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
          substituters = https://cache.iog.io/ https://cache.nixos.org/

    - name: Get ogmios from the Hydra cache
      uses: ./.github/actions/ogmios-from-hydra

    - name: Download cardano-node configs
      env:
        BASE_URL: https://raw.githubusercontent.com/input-output-hk/cardano-playground/refs/tags/${{ env.CARDANO_CONFIG_TAG }}/docs/environments/preview
      run: |
        mkdir -p config/preview
        cd config/preview
        for f in config.json topology.json peer-snapshot.json checkpoints.json \
                 byron-genesis.json shelley-genesis.json alonzo-genesis.json conway-genesis.json; do
          curl -sfLO "$BASE_URL/$f"
        done

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # Read-only: Network Synchronization is the only writer of this cache, so
    # concurrent pull request runs cannot delete each other's objects.
    - name: Restore cardano-node DB from S3
      env:
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        nix shell nixpkgs#s5cmd -c \
          ./.github/workflows/scripts/preview-db-restore.sh "$S3_DB_PATH" "$RUNNER_TEMP/db-preview"

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: lts/jod

    - name: Build TypeScript client
      working-directory: clients/TypeScript
      run: |
        yarn install --frozen-lockfile --non-interactive --loglevel=error
        yarn build
        yarn lint

    - name: Start cardano-node and wait for sync
      id: sync
      working-directory: clients/TypeScript
      env:
        CONFDIR: ${{ github.workspace }}/config/preview
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        sudo ../../server/bin/ogmios --port 1337 --log-level error --node-socket "$RUNNER_TEMP/ipc/node.socket" --node-config "$CONFDIR/config.json" &

        docker run -d --name cardano-node \
          -v "$RUNNER_TEMP/db-preview:/db" \
          -v "$RUNNER_TEMP/ipc:/ipc" \
          -v "$CONFDIR:/config" \
          "ghcr.io/intersectmbo/cardano-node:$CARDANO_NODE_VERSION" run --config /config/config.json --database-path /db --socket-path /ipc/node.socket --topology /config/topology.json

        ../../scripts/wait-for-sync.sh 1337 1 "docker logs --since 10s cardano-node"

    - name: Run integration tests
      working-directory: clients/TypeScript
      run: yarn test

    # A node under load takes well over the 10s default to flush and write its
    # clean-shutdown marker; without it the next start revalidates everything.
    - name: Stop cardano-node
      if: always() && steps.sync.outcome != 'skipped'
      run: |
        docker stop -t 300 cardano-node || true
        docker rm cardano-node || true

  # Preview has no Dijkstra blocks, so this job makes its own Dijkstra devnet.
  dijkstra_devnet:
    # The ogmios binary comes from Hydra, which may not build pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The waits for Hydra and for the devnet add up to about 50 minutes.
    timeout-minutes: 75
    runs-on: ubuntu-24.04
    env:
      # cardano-node 11.2.0
      CARDANO_NODE_FLAKE: github:IntersectMBO/cardano-node/dac0d7ab2dfdee1f9eda901589e3c6ac8eaa1899
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: true
        persist-credentials: false

    - name: Install Nix
      uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
      with:
        extra_nix_config: |
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
          substituters = https://cache.iog.io/ https://cache.nixos.org/

    - name: Get ogmios from the Hydra cache
      uses: ./.github/actions/ogmios-from-hydra

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: lts/jod

    - name: Build TypeScript client
      working-directory: clients/TypeScript
      run: |
        yarn install --frozen-lockfile --non-interactive --loglevel=error
        yarn build

    - name: Run the Dijkstra devnet test
      run: |
        nix shell "$CARDANO_NODE_FLAKE#cardano-testnet" "$CARDANO_NODE_FLAKE#cardano-node" "$CARDANO_NODE_FLAKE#cardano-cli" -c \
          scripts/dijkstra-devnet-test.sh server/bin/ogmios \
          yarn --cwd clients/TypeScript/packages/client test DijkstraDevnet
