---
name: Network Synchronization

on:
  schedule:
  - cron: '00 06 */2 * *'
  workflow_dispatch:
    inputs:
      synchronization-level:
        description: 'Desired % synchronization level. Between 0 and 1.'
        required: false
        default: 1
        type: number

permissions:
  contents: read

cache-mode: none

env:
  CARDANO_NODE_VERSION: "11.1.1"
  # cardano-playground has no node-11.1.1-config tag yet, so configs stay
  # pinned to the newest tagged set.
  CARDANO_CONFIG_TAG: "node-11.0.1-config"
  S3_DB_PATH: s3://${{ secrets.AWS_S3_BUCKET }}/db-preview

jobs:
  sync_and_cache:
    # One writer across scheduled/manual runs and all selected refs.
    concurrency:
      group: preview-db-cache-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Download cardano-node configs
      env:
        BASE_URL: https://raw.githubusercontent.com/input-output-hk/cardano-playground/refs/tags/${{ env.CARDANO_CONFIG_TAG }}/docs/environments/preview
      run: |
        mkdir -p config/preview
        cd config/preview
        for f in config.json topology.json peer-snapshot.json checkpoints.json \
                 byron-genesis.json shelley-genesis.json alonzo-genesis.json conway-genesis.json; do
          curl -sfLO "$BASE_URL/$f"
        done

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Install Nix
      uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
      with:
        extra_nix_config: |
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
          substituters = https://cache.iog.io/ https://cache.nixos.org/

    - name: Restore cardano-node DB from S3
      id: restore
      env:
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        nix shell nixpkgs#s5cmd -c \
          ./.github/workflows/scripts/preview-db-restore.sh "$S3_DB_PATH" "$RUNNER_TEMP/db-preview"

    - name: Sync node
      id: sync
      env:
        CONFDIR: ${{ github.workspace }}/config/preview
        RUNNER_TEMP: ${{ runner.temp }}
        SYNC_LEVEL: ${{ inputs.synchronization-level || 1 }}
      run: |
        docker run -d --name cardano-node \
          -v "$RUNNER_TEMP/db-preview:/db" \
          -v "$RUNNER_TEMP/ipc:/ipc" \
          -v "$CONFDIR:/config" \
          "ghcr.io/intersectmbo/cardano-node:$CARDANO_NODE_VERSION" run --config /config/config.json --database-path /db --socket-path /ipc/node.socket --topology /config/topology.json

        echo "Waiting for node socket..."
        while [ ! -S "$RUNNER_TEMP/ipc/node.socket" ]; do
          sleep 5
        done

        echo "Waiting for sync to reach $SYNC_LEVEL..."
        while true; do
          tip=$(docker exec cardano-node cardano-cli query tip --testnet-magic 2 2>/dev/null) || { sleep 5; continue; }
          sync=$(echo "$tip" | jq -r '.syncProgress // "0"' | tr -d '%')
          pct=$(echo "scale=4; $sync / 100" | bc)
          echo "Sync progress: ${sync}%"
          if [ "$(echo "$pct >= $SYNC_LEVEL" | bc)" -eq 1 ]; then
            echo "Reached target sync level"
            break
          fi
          sleep 30
        done

    # A node under load takes well over the 10s default to flush and write its
    # clean-shutdown marker; without it the next start revalidates everything.
    - name: Stop cardano-node
      id: stop
      if: always() && steps.sync.outcome != 'skipped'
      run: |
        docker stop -t 300 cardano-node
        docker rm cardano-node

    # Save partial sync progress only after a successful restore and shutdown.
    # The save script also requires the node's clean-shutdown marker.
    - name: Save cardano-node DB to S3
      if: always() && steps.restore.outcome == 'success' && steps.sync.outcome != 'skipped' && steps.stop.outcome == 'success'
      env:
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        nix shell nixpkgs#s5cmd -c \
          ./.github/workflows/scripts/preview-db-save.sh "$S3_DB_PATH" "$RUNNER_TEMP/db-preview"
